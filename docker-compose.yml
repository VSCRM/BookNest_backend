# BookNest — combined stack.
#
# Runs:
#   - auth_postgres : Postgres for auth-service's user table
#   - kafka         : Apache Kafka (KRaft mode, no ZooKeeper needed)
#   - backend        : ONE container running BOTH auth-service (Spring, :9000)
#                       and the Rails app (:3000). See combined/entrypoint.sh
#                       for why they're merged: running them as separate
#                       containers meant they could end up with two different
#                       system clocks (Docker Desktop VM clock drift, most
#                       commonly after the host machine sleeps/resumes), and
#                       Rails would then reject perfectly valid, freshly-
#                       issued JWTs as "expired" — the 401-everywhere bug.
#                       One container = one shared kernel clock = that
#                       specific skew is no longer possible. The container
#                       also self-syncs against real-world time on startup.
#
# The frontend (Frontend/) is still NOT part of
# this file — run them yourself:
#   cd ../Frontend && npm install && npm run dev   # http://localhost:5174/
#
# Before first run:
#   cp BookNest/.env.example .env
#   # then also copy the Google OAuth / EmailJS values you were using in
#   # auth-service/.env into that same root .env (see the vars below).
#
# Start:
#   docker compose up --build
#
# This supersedes running `auth-service/docker-compose.yml` (postgres-only)
# and `BookNest/docker-compose.yml` (Rails-only) separately — don't run all
# three at once, they'll fight over the same ports/containers.

services:
  auth_postgres:
    image: postgres:16-alpine
    container_name: booknest_auth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Kyiv
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: booknest_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  backend:
    build:
      context: .
      dockerfile: combined/Dockerfile
    container_name: booknest_backend
    restart: unless-stopped
    depends_on:
      auth_postgres:
        condition: service_healthy
    # Lets the entrypoint call settimeofday() to sync the container's clock
    # against real-world time on startup (see combined/entrypoint.sh).
    # Without this cap, htpdate silently can't actually set the clock.
    cap_add:
      - SYS_TIME
    ports:
      - "8080:3000" # Rails, same port BookNest used before
      - "9000:9000" # Spring auth-service, unchanged
    environment:
      TZ: Europe/Kyiv

      # ── Rails (BookNest/backend) ──────────────────────────────────────
      # Was hardcoded to "development" — couldn't be overridden without
      # editing this file. Now settable via .env, still defaults the same.
      RAILS_ENV: ${RAILS_ENV}
      # This repo has no config/credentials.yml.enc, so a RAILS_MASTER_KEY
      # would decrypt nothing — SECRET_KEY_BASE is what production Rails
      # actually needs (takes priority over credentials when set directly,
      # no encrypted file required), so that's the only one wired up here.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      # Only read when RAILS_ENV=production (config/database.yml) — see
      # that file's comment on why this must NOT be named DB_NAME. Only
      # matters for locally testing the production path against Neon;
      # ignored entirely in normal local dev (SQLite, RAILS_ENV=development).
      RAILS_DB_NAME: ${RAILS_DB_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Optional: seed several admins at once as "email1:pass1,email2:pass2".
      # Takes priority over ADMIN_EMAIL/ADMIN_PASSWORD above when set (see
      # BookNest/backend/db/seeds.rb and auth-service's AdminSeeder.java).
      ADMIN_ACCOUNTS: ${ADMIN_ACCOUNTS}
      GUEST_EMAIL: ${GUEST_EMAIL}
      GUEST_PASSWORD: ${GUEST_PASSWORD}

      # ── auth-service (Spring) ─────────────────────────────────────────
      SERVER_PORT: 9000
      # Was hardcoded to "auth_postgres"/5432 (this stack's own local
      # Postgres container) — couldn't be pointed at Neon for local
      # testing without editing this file. Defaults are unchanged.
      DB_HOST: ${DB_HOST} # e.g. auth_postgres for the local container above, or a real host like Neon
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Local Postgres container doesn't speak SSL; a real host (Neon,
      # for local testing against it) needs DB_SSLMODE=require.
      DB_SSLMODE: ${DB_SSLMODE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS}
      FRONTEND_URL: ${FRONTEND_URL}
      # Secure requires HTTPS; None requires Secure. Both false/Lax by
      # default here, matching plain-http local docker-compose testing —
      # override in .env only once this is actually served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092 # NOT ${KAFKA_BOOTSTRAP_SERVERS} —
      # same trap as DB_HOST/DB_PORT above. Compose auto-loads the root .env
      # file (same directory as this docker-compose.yml) for ${...}
      # substitution, and that .env is ALSO the file auth-service's own
      # DotenvEnvironmentPostProcessor reads for running it standalone
      # outside Docker — where it correctly sets
      # KAFKA_BOOTSTRAP_SERVERS=localhost:9092 (Kafka's host-side port
      # mapping). Used as a substitution source here, that same
      # "localhost:9092" leaks straight into this container, where
      # "localhost" means the container itself, not the "kafka" service —
      # hence the endless "Connection to node -1 (localhost/127.0.0.1:9092)
      # could not be established" warnings. Inside this compose stack the
      # broker is always reachable at the "kafka" service exactly as
      # defined above, so this is never meant to be user-configurable here.
      # Read by BOTH auth-service and Rails (see BookNest/backend/config/
      # initializers/cors.rb) so the deployed GitHub Pages frontend and any
      # local dev server are allowed in one place. Add more origins here,
      # comma-separated, as needed — no code change required.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      # ── Shared — MUST be identical for both services, which is now
      #    automatic since they're one process group reading one env block.
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./BookNest/backend:/rails
      - bundle_cache:/usr/local/bundle
      - sqlite_data:/rails/storage
    command: ["/entrypoint.sh"]

volumes:
  auth_postgres_data:
  bundle_cache:
  sqlite_data:
