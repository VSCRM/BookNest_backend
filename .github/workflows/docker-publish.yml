name: Publish Docker image

# Runs when a GitHub Release is published (Releases -> Draft a new release -> Publish).
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the combined backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: combined/Dockerfile
          push: true
          # The image name must be lowercase for ghcr.io.
          tags: |
            ghcr.io/vscrm/booknest-backend:${{ github.event.release.tag_name }}
            ghcr.io/vscrm/booknest-backend:latest
          # Links the package to this repository on GitHub.
          labels: |
            org.opencontainers.image.source=https://github.com/VSCRM/BookNest_backend
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
